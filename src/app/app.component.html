<div class="app-shell">
  <header class="topbar">
    <nav class="nav-shell" aria-label="Primary navigation">
      <a class="brand" routerLink="/home" (click)="closeMenu()" aria-label="LevelUp Learning home">
        <span class="brand-mark">L</span>
        <span class="brand-text">
          <strong>LevelUp</strong>
          <small>Learning</small>
        </span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [class.open]="isMenuOpen"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="primary-navigation"
        aria-label="Toggle navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <button
        class="nav-backdrop"
        type="button"
        [class.open]="isMenuOpen"
        (click)="closeMenu()"
        aria-hidden="true"
        tabindex="-1"
      ></button>

      <div id="primary-navigation" class="nav-panel" [class.open]="isMenuOpen">
        <a
          *ngFor="let item of navItems"
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>

        <div class="nav-progress" aria-label="Current learning status">
          <span>Level 4</span>
          <strong>8,240 XP</strong>
        </div>
      </div>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
